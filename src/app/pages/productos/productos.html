<div class="Productos">

    

        <div id="contenedorProductos">

            @for (vino of vinos; track vino.id){
                <div class="cardVinos">

                    <h4>{{vino.nombre}}</h4>
                    <p>{{vino.descripcion}}</p>
                    <img [src]="vino.img" [alt]="vino.nombre">
                </div>
            }


        </div>



</div>
