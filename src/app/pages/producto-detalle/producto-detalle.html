<div id="detalleProducto">

    <div id="imagenProducto">
        <img
            [src]="producto.img"
            [alt]="producto.nombre">
    </div>


    <div id="contenidoProducto">

        <p class="categoria">SARMIA</p>

        <h1>{{ producto.nombre }}</h1>

        <hr>

        <p class="descripcion">
            {{ producto.descripcion }}
        </p>

        <button routerLink="/productos">
            ← Volver a productos
        </button>

    </div>

</div>
